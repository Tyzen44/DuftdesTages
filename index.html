<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🧴 Duft des Tages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .parfum-display {
            text-align: center;
            padding: 40px 20px;
        }

        .parfum-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .parfum-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .parfum-brand {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }

        .parfum-details {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .detail-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .notes-box {
            margin-top: 20px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .notes-box strong {
            display: inline-block;
            min-width: 65px;
            color: #333;
        }

        .note-item {
            margin-bottom: 10px;
        }

        .note-item:last-child {
            margin-bottom: 0;
        }

        .progress-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .empty-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .history-card {
            margin-top: 20px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-name {
            font-weight: 600;
            color: #333;
        }

        .history-brand {
            font-size: 14px;
            color: #666;
        }

        .history-date {
            font-size: 12px;
            color: #999;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .collapse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 15px 0;
            border-bottom: 2px solid #f0f0f0;
        }

        .collapse-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .collapse-icon {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .collapse-icon.open {
            transform: rotate(180deg);
        }

        .collapse-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapse-content.open {
            max-height: 1000px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🧴 Duft des Tages</h1>
            <div class="subtitle">Deine tägliche Duft-Empfehlung</div>
        </div>

        <div class="card">
            <div id="parfumDisplay"></div>
            <div id="buttonGroup"></div>

            <div class="progress-section">
                <div class="progress-info">
                    <span id="progressText">0/75 Düfte verwendet</span>
                    <span id="roundText">Durchgang 1</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <div class="card stats-grid">
            <div class="stat-box">
                <div class="stat-number" id="totalUsed">0</div>
                <div class="stat-label">Düfte benutzt</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="currentRound">1</div>
                <div class="stat-label">Durchgang</div>
            </div>
        </div>

        <div class="card history-card">
            <div class="collapse-header" onclick="toggleHistory()">
                <div class="collapse-title">📜 Letzte 10 Düfte</div>
                <div class="collapse-icon" id="historyIcon">▼</div>
            </div>
            <div class="collapse-content" id="historyContent">
                <div id="historyList"></div>
            </div>
        </div>

        <div class="card">
            <button class="reset-btn" onclick="resetAll()">🔄 Komplett zurücksetzen</button>
        </div>
    </div>

            { name: "Rochas Man", brand: "Rochas", family: "Gourmand-Holzig", kopf: "Lavendel, Bergamotte", herz: "Cappuccino, Himbeere, Jasmin, Virginiazeder, Maiglöckchen", basis: "Vanille, Amber, Sandelholz, Patschuli", duration: "5.0h", dupeOf: "Original Designer" },
            { name: "Bottled", brand: "Hugo Boss", family: "Holzig-Würzig", kopf: "Apfel, Zitrone, Pflaume", herz: "Geranium, Zimt, Nelke, Olivenholz", basis: "Sandelholz, Zeder", duration: "6.0h", dupeOf: "Original Designer" },
            { name: "Only the Brave", brand: "Diesel", family: "Ledrig-Holzig", kopf: "Zitrone, Mandarine", herz: "Koriander", basis: "Zeder, Leder, Amber, Labdanum, Benzoe", duration: "7.0h", dupeOf: "Original Designer" },
            { name: "Vanilla Sex", brand: "Tom Ford", family: "Amber-Vanille", kopf: "Bittermandel", herz: "Vanille, Florales, Jasmin", basis: "Vanille Absolute, Tonkabohne, Sandelholz, Ultravanil", duration: "8.0h", dupeOf: "Original Designer" },
            { name: "Lost Cherry", brand: "Tom Ford", family: "Süß-Fruchtig", kopf: "Bittermandel, Schwarze Kirsche, Kirschlikör", herz: "Sauerkirsche, Pflaume, Türkische Rose, Jasmin Sambac", basis: "Vanille, Tonkabohne, Zimt, Peru Balsam, Sandelholz, Benzoe, Nelke, Zeder", duration: "7.0h", dupeOf: "Original Designer" },
            { name: "Noir Extreme", brand: "Tom Ford", family: "Oriental-Holzig", kopf: "Mandarine", herz: "Neroli, Kulfi, Rose, Jasmin", basis: "Amber, Sandelholz, Vanille", duration: "7.0h", dupeOf: "Original Designer" }
        ];

        // localStorage Keys
        const STORAGE_KEYS = {
            currentParfum: 'duft_current',
            usedParfums: 'duft_used',
            currentRound: 'duft_round',
            history: 'duft_history',
            lastUpdate: 'duft_lastUpdate',
            queue: 'duft_queue',
            confirmed: 'duft_confirmed'
        };

        // Initialisierung
        function init() {
            checkNewDay();
            displayParfum();
            updateStats();
            updateHistory();
            scheduleMidnightReset();
        }

        // Prüfen ob neuer Tag
        function checkNewDay() {
            const lastUpdate = localStorage.getItem(STORAGE_KEYS.lastUpdate);
            const today = new Date().toDateString();

            if (lastUpdate !== today) {
                // Neuer Tag - Reset für neuen Duft
                localStorage.removeItem(STORAGE_KEYS.currentParfum);
                localStorage.removeItem(STORAGE_KEYS.confirmed);
            }
        }

        // Automatischer Reset um Mitternacht
        function scheduleMidnightReset() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);

            const timeUntilMidnight = tomorrow - now;

            setTimeout(() => {
                checkNewDay();
                displayParfum();
                updateStats();
                // Nächsten Midnight-Reset planen
                scheduleMidnightReset();
            }, timeUntilMidnight);
        }

        // Aktuellen Duft abrufen
        function getCurrentParfum() {
            const stored = localStorage.getItem(STORAGE_KEYS.currentParfum);
            return stored ? JSON.parse(stored) : null;
        }

        // Verwendete Düfte abrufen
        function getUsedParfums() {
            const stored = localStorage.getItem(STORAGE_KEYS.usedParfums);
            return stored ? JSON.parse(stored) : [];
        }

        // Aktuellen Durchgang abrufen
        function getCurrentRound() {
            const stored = localStorage.getItem(STORAGE_KEYS.currentRound);
            return stored ? parseInt(stored) : 1;
        }

        // Prüfen ob heutiger Duft bestätigt wurde
        function isConfirmed() {
            return localStorage.getItem(STORAGE_KEYS.confirmed) === 'true';
        }

        // Duft bestätigen
        function confirmParfum() {
            localStorage.setItem(STORAGE_KEYS.confirmed, 'true');
            displayParfum();
        }

        // Queue abrufen oder erstellen
        function getQueue() {
            const stored = localStorage.getItem(STORAGE_KEYS.queue);
            if (stored) {
                return JSON.parse(stored);
            } else {
                return shuffleArray([...allParfums]);
            }
        }

        // Array shufflen (Fisher-Yates) - GARANTIERT ECHTE ZUFÄLLIGKEIT
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Neuen Duft auswählen
        function selectNewParfum() {
            let queue = getQueue();
            const used = getUsedParfums();

            // Wenn Queue leer, neuen Durchgang starten
            if (queue.length === 0) {
                const newRound = getCurrentRound() + 1;
                localStorage.setItem(STORAGE_KEYS.currentRound, newRound);
                localStorage.setItem(STORAGE_KEYS.usedParfums, JSON.stringify([]));
                queue = shuffleArray([...allParfums]);
            }

            // Nächsten Duft aus Queue nehmen
            const nextParfum = queue.shift();

            // Speichern
            localStorage.setItem(STORAGE_KEYS.queue, JSON.stringify(queue));
            localStorage.setItem(STORAGE_KEYS.currentParfum, JSON.stringify(nextParfum));
            localStorage.setItem(STORAGE_KEYS.lastUpdate, new Date().toDateString());

            // Zur Used-Liste hinzufügen
            const newUsed = [...used, {
                ...nextParfum,
                date: new Date().toISOString()
            }];
            localStorage.setItem(STORAGE_KEYS.usedParfums, JSON.stringify(newUsed));

            // History aktualisieren
            updateHistoryStorage(nextParfum);

            displayParfum();
            updateStats();
            updateHistory();
        }

        // History aktualisieren
        function updateHistoryStorage(parfum) {
            const stored = localStorage.getItem(STORAGE_KEYS.history);
            const history = stored ? JSON.parse(stored) : [];

            history.unshift({
                ...parfum,
                date: new Date().toISOString()
            });

            // Nur letzte 20 behalten
            const trimmed = history.slice(0, 20);
            localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(trimmed));
        }

        // Duft anzeigen
        function displayParfum() {
            const current = getCurrentParfum();
            const confirmed = isConfirmed();
            const displayDiv = document.getElementById('parfumDisplay');
            const buttonDiv = document.getElementById('buttonGroup');

            if (!current) {
                displayDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎯</div>
                        <div class="empty-text">Bereit für deinen Duft des Tages?</div>
                    </div>
                `;
                buttonDiv.innerHTML = `
                    <button class="btn btn-primary" onclick="selectNewParfum()">
                        🎲 Duft auswählen
                    </button>
                `;
            } else {
                displayDiv.innerHTML = `
                    <div class="parfum-display">
                        <div class="parfum-icon">🧴</div>
                        <div class="parfum-name">${current.name}</div>
                        <div class="parfum-brand">${current.brand}</div>
                        <div class="parfum-details">
                            <div class="detail-tag">🎨 ${current.family}</div>
                            <div class="detail-tag">⏱️ ${current.duration}</div>
                            <div class="detail-tag">✨ ${current.dupeOf}</div>
                        </div>
                        <div class="notes-box">
                            ${current.kopf ? `<div class="note-item"><strong>🌸 Kopf:</strong> ${current.kopf}</div>` : ''}
                            ${current.herz ? `<div class="note-item"><strong>❤️ Herz:</strong> ${current.herz}</div>` : ''}
                            ${current.basis ? `<div class="note-item"><strong>🌳 Basis:</strong> ${current.basis}</div>` : ''}
                        </div>
                    </div>
                `;

                if (confirmed) {
                    // Duft wurde bestätigt - nur Info anzeigen
                    buttonDiv.innerHTML = `
                        <div style="text-align: center; padding: 20px; color: #667eea; font-weight: 600;">
                            ✅ Duft bestätigt!<br>
                            <span style="font-size: 14px; opacity: 0.8;">Morgen um 00:00 Uhr gibt's einen neuen Duft</span>
                        </div>
                    `;
                } else {
                    // Duft nicht bestätigt - Buttons zeigen
                    buttonDiv.innerHTML = `
                        <div class="button-group">
                            <button class="btn btn-secondary" onclick="skipParfum()">
                                ↩️ Doch nicht
                            </button>
                            <button class="btn btn-primary" onclick="confirmParfum()">
                                ✅ Passt!
                            </button>
                        </div>
                    `;
                }
            }
        }

        // Duft überspringen
        function skipParfum() {
            const current = getCurrentParfum();
            if (!current) return;

            // Aktuellen Duft zurück in Queue
            let queue = getQueue();
            queue.push(current);

            // Queue neu shufflen
            queue = shuffleArray(queue);
            localStorage.setItem(STORAGE_KEYS.queue, JSON.stringify(queue));

            // Aus Used-Liste entfernen
            const used = getUsedParfums();
            const newUsed = used.filter(p => p.name !== current.name || p.brand !== current.brand);
            localStorage.setItem(STORAGE_KEYS.usedParfums, JSON.stringify(newUsed));

            // Aktuellen Duft und confirmed-Status löschen
            localStorage.removeItem(STORAGE_KEYS.currentParfum);
            localStorage.removeItem(STORAGE_KEYS.confirmed);

            // Neuen Duft auswählen
            selectNewParfum();
        }

        // Stats aktualisieren
        function updateStats() {
            const used = getUsedParfums();
            const round = getCurrentRound();
            const totalInRound = used.length;
            const percentage = (totalInRound / allParfums.length) * 100;

            document.getElementById('progressText').textContent = `${totalInRound}/${allParfums.length} Düfte verwendet`;
            document.getElementById('roundText').textContent = `Durchgang ${round}`;
            document.getElementById('progressFill').style.width = `${percentage}%`;
            document.getElementById('totalUsed').textContent = totalInRound;
            document.getElementById('currentRound').textContent = round;
        }

        // History anzeigen
        function updateHistory() {
            const stored = localStorage.getItem(STORAGE_KEYS.history);
            const history = stored ? JSON.parse(stored) : [];
            const historyDiv = document.getElementById('historyList');

            if (history.length === 0) {
                historyDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">Noch keine Düfte verwendet</div>';
                return;
            }

            const last10 = history.slice(0, 10);
            historyDiv.innerHTML = last10.map(p => {
                const date = new Date(p.date);
                const dateStr = date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });

                return `
                    <div class="history-item">
                        <div>
                            <div class="history-name">${p.name}</div>
                            <div class="history-brand">${p.brand}</div>
                        </div>
                        <div class="history-date">${dateStr}</div>
                    </div>
                `;
            }).join('');
        }

        // History togglen
        function toggleHistory() {
            const content = document.getElementById('historyContent');
            const icon = document.getElementById('historyIcon');

            content.classList.toggle('open');
            icon.classList.toggle('open');
        }

        // Alles zurücksetzen
        function resetAll() {
            if (!confirm('Wirklich ALLES zurücksetzen? Das kann nicht rückgängig gemacht werden!')) {
                return;
            }

            Object.values(STORAGE_KEYS).forEach(key => {
                localStorage.removeItem(key);
            });

            localStorage.setItem(STORAGE_KEYS.currentRound, '1');

            init();
        }

        // Beim Laden initialisieren
        init();
    </script>
